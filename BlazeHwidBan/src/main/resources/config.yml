# BlazeHwidBan 配置
# 指纹盐值: 设为 auto 时首次启动自动生成; 修改盐值会使所有已采集指纹失效
salt: "auto"

fingerprint:
  include-brand: true      # 客户端品牌 (vanilla / fabric / forge 等)
  include-locale: true     # 游戏语言
  include-settings: true   # 客户端设置 (主手/聊天/皮肤/渲染距离/粒子等)
  include-channels: true   # 客户端注册的插件频道 (反映模组安装情况)

# 配套客户端模组上报真实机器码的插件消息频道
# 客户端向该频道发送一条 UTF-8 文本: 64 位十六进制 SHA-256 (可带 HWID: 前缀)
channel: "blaze:hwid"

# 原版封禁联动: 执行 /ban (含控制台与 Essentials 等) 后, 自动补封该玩家的
# 指纹与上报机器码, 并立即踢出在线的同机账号; 启动时也会把 banned-players.json
# 里的既有原生封禁转换为机器码封禁
sync-vanilla-ban: true
# 原版解封联动: 执行 /pardon 后, 同步解除该玩家名下的机器码封禁;
# 反向同理, /hwidban unban 也会同步解除该玩家名下的原版封禁
sync-vanilla-unban: true

# 反作弊/处罚插件联动 (Grim / Vulcan / Matrix / LiteBans / AdvancedBan 等):
# 这些插件的自动处罚本质是"执行配置的命令", 且多数自建数据库不写 banned-players.json,
# 所以通过识别它们执行的封禁命令来联动机器码封禁。
# 用法: 反作弊的处罚命令写成 ban 类 (如 punishments.yml 里配 "ban %player%" 或
#       "litebans ban %player%"), 本联动即自动生效; 写成 kick 不联动 (踢出≠封禁)。
# 原版 /ban /pardon 已内置识别, 无需在下方声明。
anticheat-sync:
  enabled: true
  # 仅控制台与 hwidban.admin 管理员执行的命令才触发联动:
  # 反作弊自动处罚一律走控制台; 普通玩家乱敲封禁命令不会真正生效, 联动会造成误封
  only-console: true
  # 额外识别的"封禁"命令头 (正则; 玩家名自动从参数提取, -开头的开关参数自动跳过)
  # 装了 LiteBans/AdvancedBan 后想让它接管的原版形态 /ban /tempban 也联动的话,
  # 自行追加 '- ^ban\b' 与 '- ^tempban\b' (去掉前面这个短横)
  ban-commands:
    - '(?i)^/?(?:litebans:)?litebans\s+(?:ban|tempban|ipban)\b'
    - '(?i)^/?(?:vulcan:)?vulcan\s+ban\b'
    - '(?i)^/?(?:spartan:)?spartan\s+(?:ban|tempban)\b'
  # 额外识别的"解封"命令头, 联动解除机器码封禁与原版封禁
  unban-commands:
    - '(?i)^/?(?:litebans:)?litebans\s+unban\b'
    - '(?i)^/?(?:spartan:)?spartan\s+unban\b'

# 黑客端识别 (client-guard): 拦截外挂客户端加入服务器
# 三道防线:
#   ① 客户端品牌(brand)黑名单/白名单 —— 对所有客户端生效
#   ② 违规 Fabric 模组黑名单 —— 依赖玩家安装了配套客户端 mod (mod 会上报模组列表)
#   ③ require-mod 强制安装配套客户端 —— 未装者拒入, 最强防护, 默认关闭
# 处理动作 action: kick=踢出, alert=仅提醒管理员, none=不处理
client-guard:
  enabled: true
  action: kick
  # 进服几秒后执行品牌/模组检查
  check-delay: 2
  # 品牌黑名单 (正则; 覆盖常见外挂端品牌特征, 原版/Fabric 正常客户端不受影响)
  blocked-brands:
    - '(?i).*(liquidbounce|wurst|aristois|fdpclient|rushhack|novoline|vape|sigma|tenacity|augustus|meteor).*'
  # 白名单模式: 开启后只允许 allowed-brands 匹配的客户端进入 (Lunar/Badlion 等也会被拦, 适合服务器统一发客户端)
  whitelist-mode: false
  allowed-brands:
    - '(?i)^(vanilla|fabric)$'
  # 违规 Fabric 模组 id 黑名单 (模组 id 见各 mod 的 fabric.mod.json)
  blocked-mods:
    - meteor-client
    - liquidbounce
    - wurst
    - baritone
    - ares
    - rushhack
  # 强制安装配套客户端: 进服 require-mod-delay 秒后仍未收到机器码上报则拒绝进入
  require-mod: false
  require-mod-delay: 8

# 同机关联提醒: 玩家进服后, 若其机器码与其他账号相同, 提醒在线管理员 (hwidban.admin)
alt-notify-admins: true
# 玩家进服数秒后仍未收到机器码上报, 提醒管理员其未安装配套客户端
no-mod-notify: true
no-mod-delay: 5

# strict 模式: 一台机器绑定首个上报的账号, 同机其他账号进服直接拒绝
# 注意: 网吧/共用电脑会被误伤, 默认关闭
strict-mode: false
# strict 拒绝的同时是否自动写入机器码封禁 (换任何客户端都进不来)
strict-auto-ban: false

# 同机多账号自动处罚: 同一机器码下的不同账号数达到阈值时触发
# 统计的是本服档案中的账号数; tempban 动作会封整个机器码 (含主号), 请谨慎设置
alt-auto-action:
  enabled: false
  max-accounts: 5
  action: alert          # alert=仅提醒管理员 / tempban=临时封禁该机器码并踢出
  tempban-duration: 7d
  reason: "同机账号数量异常"

# 指纹突变告警: 玩家本次进服的客户端指纹与其历史指纹都不同时提醒管理员
# 指纹会因玩家改设置/装模组而正常变化, 仅供参考, 不会自动处罚
fingerprint-alert:
  enabled: true

# 多服务器封禁同步: 多台服务器共用同一个封禁库, 任一服封禁, 全部服生效
# backend: json=单机文件(默认, 不同步) / sqlite=SQLite库 / mysql=MySQL数据库
# 说明:
#   - sqlite 适合同一台机器跑多个服 (各服指向同一个文件); 跨机器部署请用 mysql
#   - 切换 backend / 改连接信息需重启服务器生效
#   - 首次启用 sqlite/mysql 时, 会把本地 bans.json 的既有封禁自动迁移入库
#   - 指纹档案 (profiles.json) 不参与同步: 每台服的指纹盐值不同, 指纹只在单服内有意义
sync:
  backend: json
  interval-seconds: 5    # 与共享封禁库对账的间隔 (秒)
  sqlite:
    file: bans.db        # 相对 plugins/BlazeHwidBan/; 多服共用请填指向同一文件的绝对路径
  mysql:
    host: 127.0.0.1
    port: 3306
    database: blazehwidban
    user: root
    password: ""

# 操作审计日志: 所有封禁/解封/过期动作追加记录到 bans.log
audit-log: true


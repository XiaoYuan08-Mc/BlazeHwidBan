  tempban-ok: "<green>已临时封禁 <white>{player}</white> 的 <white>{count}</white> 条机器码, 至 <white>{until}</white>, 理由: {reason}</green>"
  invalid-duration: "<red>时长格式无效, 示例: 7d / 12h / 30m / 1d12h</red>"
  invalid-hwid: "<red>机器码必须是 64 位十六进制字符串 (SHA-256)。</red>"

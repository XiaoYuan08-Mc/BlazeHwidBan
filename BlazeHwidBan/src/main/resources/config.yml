  reloaded: "<green>配置已重载。</green>"
  ban-line: "<gray><white>{hwid}</white> | {type} | {player} | 理由: {reason} | 操作者: {by} | {expires} | {date}</gray>"
  list-header: "<aqua>=== 机器码封禁列表 第 {page}/{pages} 页 ===</aqua>"
  check-header: "<aqua>=== {player} 的机器码信息 ===</aqua>"
  check-line: "<gray>- <white>{hwid}</white> {status}</gray>"
  check-reported: "<gray>上报机器码: <white>{hwid}</white> {status}</gray>"
  check-none: "<red>暂无记录。</red>"
  status-banned: "<red>[已封禁]</red>"
  status-clean: "<green>[正常]</green>"
  info: "<gray>BlazeHwidBan v{version} - 机器码(客户端指纹)封禁</gray>"
  kick: "<dark_gray><st>────────────</st><red> 机器码封禁 </red><st>────────────</st></dark_gray><newline><newline><gray>玩家: <white>{player}</white></gray><newline><gray>原因: <white>{reason}</white></gray><newline><gray>操作者: <white>{by}</white></gray><newline><gray>封禁时间: <white>{date}</white></gray><newline><gray>到期: <white>{expires}</white></gray><newline><gray>解封标识: <white>{hwid}</white> ({type})</gray><newline><newline><gray>如认为误封, 请凭上方解封标识联系管理员申诉。</gray>"

  prefix: "<gray>[<aqua>HwidBan</aqua>]</gray> "
  no-permission: "<red>你没有权限执行此操作。</red>"
  usage-ban: "<yellow>用法: /hwidban ban 玩家名 [理由]</yellow>"
  usage-tempban: "<yellow>用法: /hwidban tempban 玩家名 时长 [理由] (时长: 7d / 12h / 30m, 可组合如 1d12h)</yellow>"
  usage-alt: "<yellow>用法: /hwidban alt 玩家名</yellow>"
  usage-banhwid: "<yellow>用法: /hwidban banhwid 64位机器码 [理由]</yellow>"
  usage-unban: "<yellow>用法: /hwidban unban 机器码前缀或玩家名</yellow>"
  usage-check: "<yellow>用法: /hwidban check 玩家名</yellow>"
